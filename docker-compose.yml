services:
  app:
    # Pulls the published image. `docker compose up -d --build` builds from source instead.
    image: ghcr.io/tftgau/essentials:latest
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - essentials-data:/data

volumes:
  essentials-data:
